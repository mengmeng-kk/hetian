<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好心湖时序演变</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
        }
        body {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px;
        }
        /* 主地图容器 */
        .map-wrap {
            position: relative;
            width: 960px;
            height: 580px;
            border: 1px solid #e2e2e2;
            background: #fff;
            overflow: hidden;
        }
        /* 年份全景SVG切换层 */
        .year-map {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.45s ease;
            z-index: 1;
        }
        .year-map.active {
            opacity: 1;
            z-index: 2;
        }
        /* 左侧水位进度容器（框内） */
        .progress-bar-box {
            position: absolute;
            left: 24px;
            top: 40px;
            width: 22px;
            height: 460px;
            border: 1px solid #555555;
            background: #f8f8f8;
            z-index: 9;
        }
        .progress-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: #43a0e8;
            transition: height 0.6s ease;
        }
        .progress-mark {
            position: absolute;
            left: -5px;
            width: 30px;
            height: 1px;
            background-color: #333;
        }
        .progress-text {
            position: absolute;
            left: -55px;
            font-size: 13px;
            color: #222;
            transform: translateX(-100%);
        }
        /* 底部年份按钮组 */
        .year-buttons {
            display: flex;
            gap: 12px;
        }
        .year-btn {
            padding: 9px 20px;
            border: 1px solid #333;
            background: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }
        .year-btn.active {
            background-color: #222;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="map-wrap">
        <!-- 左侧进度条（仅1985、2014、2025标注） -->
        <div class="progress-bar-box">
            <div class="progress-fill" id="progressFill" style="height: 0%"></div>
            <span class="progress-text" style="top: 0px">2025</span>
            <span class="progress-mark" style="top: 0px"></span>

            <span class="progress-text" style="top: 230px">2014</span>
            <span class="progress-mark" style="top: 230px"></span>

            <span class="progress-text" style="bottom: 0px">1985</span>
            <span class="progress-mark" style="bottom: 0px"></span>
        </div>

        <!-- 6张年份SVG图层 -->
        <object class="year-map active" data="lake_1985.svg" type="image/svg+xml" data-year="1985"></object>
        <object class="year-map" data="lake_2014.svg" type="image/svg+xml" data-year="2014"></object>
        <object class="year-map" data="lake_2016.svg" type="image/svg+xml" data-year="2016"></object>
        <object class="year-map" data="lake_2017.svg" type="image/svg+xml" data-year="2017"></object>
        <object class="year-map" data="lake_2018.svg" type="image/svg+xml" data-year="2018"></object>
        <object class="year-map" data="lake_2025.svg" type="image/svg+xml" data-year="2025"></object>
    </div>

    <!-- 底部年份按钮 -->
    <div class="year-buttons">
        <button class="year-btn active" data-year="1985">1985</button>
        <button class="year-btn" data-year="2014">2014</button>
        <button class="year-btn" data-year="2016">2016</button>
        <button class="year-btn" data-year="2017">2017</button>
        <button class="year-btn" data-year="2018">2018</button>
        <button class="year-btn" data-year="2025">2025</button>
    </div>

    <script>
        const yearProgressConfig = {
            1985: { height: 0 },
            2014: { height: 35 },
            2016: { height: 56 },
            2017: { height: 69 },
            2018: { height: 83 },
            2025: { height: 100 }
        };

        const allMaps = document.querySelectorAll('.year-map');
        const progressDom = document.getElementById('progressFill');
        const btnList = document.querySelectorAll('.year-btn');

        function switchCurrentYear(targetYear) {
            allMaps.forEach(item => {
                item.classList.toggle('active', item.dataset.year === targetYear);
            });
            btnList.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.year === targetYear);
            });
            progressDom.style.height = yearProgressConfig[targetYear].height + '%';
        }

        btnList.forEach(btn => {
            btn.addEventListener('click', () => {
                switchCurrentYear(btn.dataset.year);
            })
        })
    </script>
</body>
</html>
