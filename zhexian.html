<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>1985-2025年好心湖矿区水体面积变化</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
}
#main {
    width: 94%;
    height: 92vh;
    margin: 0 auto;
}
</style>
</head>
<body>
<div id="main"></div>
<script>
const myChart = echarts.init(document.getElementById('main'));
const option = {
    backgroundColor: '#ffffff',
    title: {
        text: '1985-2025年好心湖矿区水体面积变化',
        left: 'center',
        top: 20,
        textStyle: {
            fontSize: 24,
            fontWeight: 500,
            color: '#333333'
        }
    },
    tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(255,255,255,0.95)',
        borderRadius: 8,
        borderColor: '#739de0',
        padding: 12,
        formatter: '{b}<br>水体面积：{c} 平方千米'
    },
    grid: {
        left: '14%',
        right: '6%',
        top: '20%',
        bottom: '14%'
    },
    xAxis: {
        type: 'category',
        name: '年份',
        nameLocation: 'middle',
        nameGap: 20,
        nameTextStyle: {fontSize:16, color:'#444'},
        data: ['1985年', '2014年', '2016年', '2017年', '2018年', '2025年'],
        axisLine: {lineStyle: {color: '#cccccc'}},
        axisLabel: {fontSize:14, color:'#555'},
        splitLine: {show: false}
    },
    yAxis: {
        type: 'value',
        name: '矿区水体面积（平方千米）',
        nameLocation: 'middle',
        nameRotate: 90,
        nameGap: 35,
        nameTextStyle: {fontSize:15, color:'#444'},
        min: 5.9,
        max: 6.9,
        interval: 0.1,
        axisLine: {lineStyle: {color: '#cccccc'}},
        axisLabel: {fontSize:14, color:'#555'},
        splitLine: {
            lineStyle: {color: '#eeeeee'}
        }
    },
    series: [
        {
            name: '水体面积',
            type: 'line',
            smooth: true,
            lineStyle: {
                color: '#4278d3',
                width: 3
            },
            symbol: 'circle',
            symbolSize: 11,
            itemStyle: {
                color: '#ffffff',
                borderColor: '#4278d3',
                borderWidth: 2
            },
            label: {
                show: true,
                position: 'top',
                fontSize:14,
                color: '#444444',
                distance: 8
            },
            areaStyle: {
                color: {
                    type: 'linear',
                    x: 0,
                    y: 0,
                    x2: 0,
                    y2: 1,
                    colorStops: [
                        {offset: 0, color: 'rgba(66, 120, 211, 0.6)'},
                        {offset: 1, color: 'rgba(66, 120, 211, 0.05)'}
                    ]
                }
            },
            data: [6.0, 6.2, 6.6, 6.7, 6.8, 6.8]
        }
    ]
};
myChart.setOption(option);
window.addEventListener('resize', ()=>{
    myChart.resize();
})
</script>
</body>
</html>
