<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时序遥感影像演变</title>
<style>
:root{
    --main-color:#3663ad;
    --gray-light:#f3f5f8;
    --gray:#d8dde4;
    --text:#222831;
    /* 👇调整这个数值控制文字整体向右移动，和图片内部画面左边界对齐 */
    --offsetLeft:16px;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body {
    background-color: var(--gray-light);
    font-family: "Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    padding:40px 20px;
}
.wrapper{
    max-width:1000px;
    margin:0 auto;
    display:flex;
    gap:28px;
    align-items:flex-start;
    background:#f0f2f5;
    border-radius:0;
    padding:0;
    box-shadow: none;
}
/* 左侧垂直时间轴容器 */
.timeline{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    padding:12px 0;
    margin-top:80px;
}
.timeline::before{
    content:"";
    position:absolute;
    width:3px;
    background:var(--gray);
    top:24px;
    bottom:24px;
    left:17px;
    z-index:1;
    border-radius:3px;
}
.time-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    position:relative;
    z-index:2;
    margin:20px 0;
}
/* 圆点样式匹配参考图 */
.dot{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--gray);
    transition:all 0.3s ease;
    margin-bottom:8px;
}
.time-node.active .dot{
    border-color:var(--main-color);
    background:var(--main-color);
    box-shadow:0 0 0 5px rgba(54, 99, 173, 0.18);
}
.time-node:hover .dot{
    border-color:var(--main-color);
}
.label{
    font-size:15px;
}
.time-node.active .label{
    color:var(--main-color);
    font-weight:500;
}
/* 右侧区域：地图 + 下方横向文字 */
.right-box{
    display:flex;
    flex-direction:column;
    gap:16px;
    flex:1;
}
.view-box{
    position:relative;
    width:100%;
    height:620px;
    overflow:hidden;
    border-radius:0;
    background:#f0f2f5;
}
.view-box img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 0.8s ease;
}
.view-box img.active{
    opacity:1;
}
/* 文字使用变量控制整体右移 */
.info-panel{
    display:flex;
    gap:24px;
    justify-content:flex-start;
    padding:12px 0 0 var(--offsetLeft);
    margin:0;
}
.year-tip{
    font-size:17px;
    letter-spacing:1px;
}
.fvc-tip{
    font-size:17px;
    color:#3663ad;
    font-weight:500;
}
</style>
</head>
<body>
<div class="wrapper">
    <div class="timeline">
        <div class="time-node active" data-index="0">
            <div class="dot"></div>
            <span class="label">1985</span>
        </div>
        <div class="time-node" data-index="1">
            <div class="dot"></div>
            <span class="label">1995</span>
        </div>
        <div class="time-node" data-index="2">
            <div class="dot"></div>
            <span class="label">2015</span>
        </div>
        <div class="time-node" data-index="3">
            <div class="dot"></div>
            <span class="label">2025</span>
        </div>
    </div>

    <div class="right-box">
        <div class="view-box" id="mainView">
            <img src="1985.png" class="active" alt="1985">
            <img src="1995.png" alt="1995">
            <img src="2015.png" alt="2015">
            <img src="2025.png" alt="2025">
        </div>
        <div class="info-panel">
            <div class="year-tip" id="showYear">当前年份：1985年</div>
            <div class="fvc-tip" id="showFVC">植被覆盖区域占比：39%</div>
        </div>
    </div>
</div>

<script>
const imgs = document.querySelectorAll(".view-box img");
const nodes = document.querySelectorAll(".time-node");
const showYearText = document.getElementById("showYear");
const showFvcText = document.getElementById("showFVC");
const mainBox = document.getElementById("mainView");
const yearList = ["1985年","1995年","2015年","2025年"];
const fvcList = ["39%","42%","55%","67%"];

// 全部年份统一停留5秒
const stayTimeList = [5000, 5000, 5000, 5000];

let current = 0;
let timer = null;
let isPause = false;

function switchTo(idx){
    current = idx;
    imgs.forEach(img=>img.classList.remove("active"));
    imgs[current].classList.add("active");
    nodes.forEach(n=>n.classList.remove("active"));
    nodes[current].classList.add("active");
    showYearText.textContent = "当前年份："+yearList[current];
    showFvcText.textContent = "植被覆盖区域占比：" + fvcList[current];

    if(!isPause){
        clearTimeout(timer);
        timer = setTimeout(()=>{
            current = (current + 1) % imgs.length;
            switchTo(current);
        }, stayTimeList[current]);
    }
}

switchTo(0);

mainBox.addEventListener("mouseenter",()=>{
    isPause = true;
    clearTimeout(timer);
});
mainBox.addEventListener("mouseleave",()=>{
    isPause = false;
    clearTimeout(timer);
    timer = setTimeout(()=>{
        current = (current + 1) % imgs.length;
        switchTo(current);
    }, stayTimeList[current]);
});

nodes.forEach(node=>{
    node.addEventListener("click",()=>{
        const i = Number(node.dataset.index);
        clearTimeout(timer);
        switchTo(i);
    })
})
</script>

</body>
</html>
